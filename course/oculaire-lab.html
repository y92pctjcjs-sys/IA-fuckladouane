<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="data:,"><title>OCULAIRE — formats de contrôle</title><style>body{margin:0;background:#100c1c;color:#eee;font:14px/1.5 sans-serif}header{padding:18px 24px;position:sticky;top:0;background:#100c1cf5;z-index:2;border-bottom:1px solid #50425e}h1{margin:0;font-size:20px}label{display:inline-block;margin:10px 20px 0 0}select{background:#281d3a;color:#fff;padding:7px;border:1px solid #8d799d}main{display:flex;justify-content:center;padding:18px;min-height:850px;overflow:auto}iframe{border:1px solid #756784;flex:none;box-shadow:0 10px 70px #0009}small{color:#b9accb}a{color:#d4ff4f}</style>
<header><h1>OCULAIRE / chevelure et présence</h1><small>Le vrai moteur dans une fenêtre de téléphone. Contrôles et mesures dans l’atelier.</small><br><label>Format <select id="format"><option value="390x844">Portrait 390 × 844</option><option value="320x740">Portrait 320 × 740</option><option value="844x390">Paysage 844 × 390</option></select></label><label>Écran <select id="screen"><option value="oculaire-preview.html">Atelier visuel</option><option value="../course.html">Jeu complet</option></select></label> <a href="oculaire-preview.html">Vue plein écran</a></header>
<main><iframe id="phone" title="Téléphone OCULAIRE" width="390" height="844" src="oculaire-preview.html"></iframe></main><script>const frame=document.getElementById('phone');document.getElementById('format').onchange=e=>{const [w,h]=e.target.value.split('x');frame.width=w;frame.height=h;};document.getElementById('screen').onchange=e=>frame.src=e.target.value;</script></html>
